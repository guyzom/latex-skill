name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation_scope:
        description: Full regressions or focused caption/table PDFs for visual diagnosis
        type: choice
        default: full
        options: [full, caption, table]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: skill/hebrew-english-latex-studio
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      HEBREW_LATEX_CATALOG_VISUAL: routine
      HEBREW_LATEX_FONT_DIR: ${{ github.workspace }}/.fonts
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LuaLaTeX and Poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-lang-other texlive-latex-extra \
            texlive-science texlive-fonts-recommended poppler-utils
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements-qa.txt
      - name: Verify and stage licensed fonts
        run: bash scripts/setup_fonts.sh "$HEBREW_LATEX_FONT_DIR" --from-directory ../../assets/fonts
      - name: Check environment and package contracts
        run: |
          mkdir -p ../../test-results
          python scripts/doctor.py | tee ../../test-results/doctor.log
          python scripts/check_package_hygiene.py | tee ../../test-results/hygiene.log
          python scripts/test_release_contract.py | tee ../../test-results/contracts.log
          python scripts/test_license_scope.py 2>&1 | tee ../../test-results/license-scope.log
      - name: Run checker regressions
        run: python scripts/selftest.py | tee ../../test-results/selftest.log
      - name: Verify source resolution against LuaLaTeX
        run: python scripts/test_source_graph_runtime.py 2>&1 | tee ../../test-results/source-graph-runtime.log
      - name: Run full build and render regressions
        if: github.event_name != 'workflow_dispatch' || inputs.validation_scope == 'full'
        run: bash scripts/test_all.sh 2>&1 | tee ../../test-results/harness.log
      - name: Run focused caption runtime with retained PDF evidence
        if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'caption'
        env:
          HLLPDF_LANGUAGE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/caption-runtime
        run: |
          python scripts/test_language_runtime.py \
            LanguageRuntime.test_subcaption_rtl_labels_and_explicit_preamble_styles \
            2>&1 | tee ../../test-results/caption-runtime.log
      - name: Run focused table runtime with retained PDF evidence
        if: github.event_name == 'workflow_dispatch' && inputs.validation_scope == 'table'
        env:
          HLLPDF_LANGUAGE_EVIDENCE_DIR: ${{ github.workspace }}/test-results/table-runtime
        run: |
          python scripts/test_language_runtime.py \
            LanguageRuntime.test_gallery_keeps_unframed_examples_prominent_and_content_sized \
            2>&1 | tee ../../test-results/table-runtime.log
      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: error
